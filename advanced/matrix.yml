# PER-8195 Phase 2 — Appium-.NET matrix-row mapping.
# Test code: AdvancedTest.cs (xUnit).

sdk: appium-dotnet
package: PercyIO.Appium
language: csharp
sdk_min_version: '2.1.0'
cli_min_version: '1.31.13'

rows:
  - id: device_name_override
    state: covered
    test: 'AdvancedTests > ExercisesDeviceNameAndOrientation'
  - id: orientation_handling
    state: covered
    test: 'AdvancedTests > ExercisesDeviceNameAndOrientation'
  - id: fullscreen
    state: covered
    test: 'AdvancedTests > ExercisesFullscreenAndBars'
  - id: status_bar_height
    state: covered
    test: 'AdvancedTests > ExercisesFullscreenAndBars'
  - id: nav_bar_height
    state: covered
    test: 'AdvancedTests > ExercisesFullscreenAndBars'
  - id: ignore_regions_xpaths
    state: covered
    test: 'AdvancedTests > ExercisesIgnoreRegionsViaXpath'
  - id: ignore_region_appium_elements
    state: covered
    test: 'AdvancedTests > ExercisesIgnoreRegionsViaAppiumElement'
  - id: custom_ignore_regions
    state: covered
    test: 'AdvancedTests > ExercisesCustomIgnoreRegions'
  - id: consider_regions_xpaths
    state: covered
    test: 'AdvancedTests > ExercisesConsiderRegionsViaXpath'
  - id: sync
    state: covered
    test: 'AdvancedTests > ExercisesSyncMode'
  - id: test_case
    state: covered
    test: 'AdvancedTests > ExercisesTestCaseAndLabels'
  - id: labels
    state: covered
    test: 'AdvancedTests > ExercisesTestCaseAndLabels'

  - id: build_metadata_via_env
